<main class="p-app">

  <!-- ابدأ أو ادخل -->
  <section class="p-screen hidden" id="sStart">
    <div class="p-center">
      <div class="p-logo"><svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><circle cx="32.0" cy="10.1" r="2.70"/><circle cx="37.9" cy="16.0" r="2.70"/><circle cx="40.0" cy="24.0" r="2.70"/><circle cx="37.9" cy="32.0" r="2.70"/><circle cx="32.0" cy="37.9" r="2.70"/><circle cx="24.0" cy="40.0" r="2.70"/><circle cx="16.0" cy="37.9" r="2.70"/><circle cx="10.1" cy="32.0" r="2.70"/><circle cx="8.0" cy="24.0" r="2.70"/><circle cx="10.1" cy="16.0" r="2.70"/><circle cx="16.0" cy="10.1" r="2.70"/><circle cx="24.0" cy="8.0" r="3.90"/></svg></div>

  </section>

  <!-- إنشاء -->
  <section class="p-screen hidden" id="sNew">
    <div class="p-center">
      <h1 class="p-h1">حلقة جديدة</h1>
      <label class="pick-label">اسم الحلقة</label>
      <input class="field" id="newTitle" maxlength="30" value="حلقة العائلة">
      <label class="pick-label">الذكر</label>
      <div class="chips" id="newDhikr"></div>
      <label class="pick-label">الهدف معاً</label>
      <div class="chips" id="newGoal"></div>
      <button class="btn btn-gold" id="newGo">أنشئ وشارك</button>

</main>

<!-- إعدادات صاحب الحلقة -->

  <div class="sheet-panel">
    <div class="sheet-grip"></div>

    <label class="pick-label">الذكر</label>
    <div class="chips" id="setDhikr"></div>
    <label class="pick-label">الهدف معاً</label>
    <div class="chips" id="setGoal"></div>
    <button class="btn btn-gold full" id="setSave">حفظ</button>
    <button class="btn btn-ghost full" id="setReset">🔄 ابدأ جولة جديدة (تصفير)</button>
    <button class="p-link" id="setClose">إغلاق</button>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* الإضاءة نفسها التي اختارها في صفحة التطبيق */
try {
  if (JSON.parse(localStorage.getItem("noor_theme")) === "dark") {
    document.body.classList.add("dark");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = "#1a1d24";
  }
} catch (e) {}
</script>
<script src="../js/room.js?v=4"></script>
<script>
/* ══════════════════════════════════════════════════════════
   حلقة ذكر للعائلة — صفحة واحدة للجميع
   ----------------------------------------------------------
   كانت ثلاث صفحات مبنيّة لبثّ مباشر: شاشةُ عرضٍ للجمهور برمز QR،
   ولوحةُ مضيفٍ بروابط OBS. وهو ليس ما يحتاجه من يريد أن يسبّح مع
   أمّه: لا جمهور ولا شاشة ولا بثّ.

   فصارت صفحةً واحدة. من يفتح الرابط ينضمّ، ومن أنشأ الحلقة له
   ترسٌ صغير فيه الإعدادات. كلٌّ يرى عدّه وعدّ أهله والمجموع، على
   هاتفه هو — لا شاشة ثالثة بينهم.

   وكلٌّ يقرأ الغرفة كاملة كل أربع ثوانٍ: العائلة أفرادٌ معدودون،
   فلا حاجة إلى مُلخِّصٍ وسيط كالذي كان يكتبه البثّ.
   ══════════════════════════════════════════════════════════ */
(function () {
const $ = id => document.getElementById(id);
const SCREENS = ["sStart", "sNew", "sName", "sMain", "sMsg"];
const show = id => SCREENS.forEach(s => $(s).classList.toggle("hidden", s !== id));

const me = T.uid();
const GAP = 1000 / T.MAX_RATE;

let code = "";
let meta = null;                 // وصف الحلقة
let st = null;                   // حالتي: { name, n, sid }
let owner = false;
let dirty = false, syncing = false, started = false, lastTap = 0;
const beads = [];
const board = T.makeBoard();

function toast(t) {
  const e = $("toast");
  e.textContent = t;
  e.classList.remove("hidden");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => e.classList.add("hidden"), 2600);
}
function msg(t) { $("msgText").textContent = t; show("sMsg"); }
function setNet(ok) { $("net").classList.toggle("off", !ok); }

/* ─────────── إنشاء ─────────── */
const pick = { d: "istighfar", g: 1000 };
const GOALS = [0, 100, 500, 1000, 3000, 10000];

function chips(box, items, value, onPick) {
  box.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (it.value === value ? " on" : "");
    b.textContent = it.label;
    b.addEventListener("click", () => {
      box.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      b.classList.add("on");
      onPick(it.value);
    });
    box.appendChild(b);
  });
}
const dhikrItems = () => T.DHIKR.map(d => ({ value: d.id, label: d.text }));
const goalItems = () => GOALS.map(g => ({ value: g, label: g ? T.fmt(g) : "بلا هدف" }));

function openNew() {
  show("sNew");
  chips($("newDhikr"), dhikrItems(), pick.d, v => { pick.d = v; });
  chips($("newGoal"), goalItems(), pick.g, v => { pick.g = v; });
}

async function create() {
  const title = ($("newTitle").value || "").replace(/[<>]/g, "").trim().slice(0, 30) || "حلقة العائلة";
  $("newGo").disabled = true;
  $("newErr").textContent = "";
  try {
    // كودٌ قصير سهل النطق على الهاتف
    let c = "";
    for (let i = 0; i < 6; i++) {
      c = T.randomCode(4);
      if (!(await T.get(c, "m"))) break;
      c = "";
    }
    if (!c) { $("newErr").textContent = "جرّب مرة أخرى"; return; }
    await T.put(c, "m", { ti: title, d: pick.d, g: pick.g, sid: T.rid(8), c: T.NOW, own: me });
    T.save("mine_" + c, true);
    code = c;
    owner = true;
    await enter(c);
    share(true);
  } catch (e) {
    $("newErr").textContent = "تعذّر الاتصال — تحقّق من الإنترنت";
  } finally {
    $("newGo").disabled = false;
  }
}

/* ─────────── الدخول ─────────── */
async function enter(raw) {
  code = T.cleanCode(raw);
  if (!T.validCode(code)) { show("sStart"); return; }
  try { meta = await T.get(code, "m"); }
  catch (e) { return msg("تعذّر الاتصال — تأكّد من الإنترنت."); }
  if (!meta) return msg("لا توجد حلقة بالكود «" + code + "».");

  owner = meta.own === me || !!T.load("mine_" + code, false);
  history.replaceState(null, "", "?r=" + code);
  paintMeta();

  st = T.load("room_" + code, null);
  if (st && (st.sid || "") !== (meta.sid || "")) st = { name: st.name, n: 0, sid: meta.sid || "" };
  if (!st || !st.name) {
    $("nameIn").value = T.load("lastName", "");
    show("sName");
    setTimeout(() => $("nameIn").focus(), 150);
    return;
  }
  begin();
}

function paintMeta() {
  const d = T.dhikr(meta.d);
  $("nRoom").textContent = $("cRoom").textContent = meta.ti || "حلقة ذكر";
  $("nDhikr").textContent = $("cDhikr").textContent = d.text;
  $("totalLabel").textContent = d.noun + " معاً";
  document.title = (meta.ti || "حلقة ذكر") + " — " + d.text;
}

async function setName() {
  const name = T.cleanName($("nameIn").value);
  if (name.length < 2) { $("nameErr").textContent = "اكتب اسماً من حرفين على الأقل"; return; }
  if (T.isBad(name)) { $("nameErr").textContent = "اختر اسماً يليق بمجلس ذكر 🤍"; return; }
  $("nameErr").textContent = "";
  const fresh = !st;
  st = st || { n: 0, sid: meta.sid || "" };
  st.name = name;
  T.save("room_" + code, st);
  T.save("lastName", name);
  const body = { name, n: st.n, sid: st.sid, t: T.NOW };
  if (fresh) body.j = T.NOW;
  try { await T.patch(code, "p/" + me, body); setNet(true); }
  catch (e) { setNet(false); dirty = true; }
  begin();
}

/* ─────────── الحلقة ─────────── */
function begin() {
  show("sMain");
  $("me").textContent = st.name;
  $("ownerBtn").classList.toggle("hidden", !owner);
  drawBeads();
  paint(false);
  if (started) return;
  started = true;
  dirty = true;
  sync();
  poll();
  setInterval(sync, 1500);
  setInterval(poll, 4000);
}

function tap(e) {
  if (e && e.cancelable) e.preventDefault();
  const t = performance.now();
  if (t - lastTap < GAP) return;
  lastTap = t;
  st.n++;
  dirty = true;
  T.save("room_" + code, st);
  paint(true);
  haptic(st.n);
  wake();
  if (e && e.clientX) floatPlus(e.clientX, e.clientY);
}

function drawBeads() {
  if (beads.length) return;
  const svg = $("beads"), NS = "http://www.w3.org/2000/svg";
  const R = 91, G = 22;
  for (let i = 0; i < 33; i++) {
    const a = (-90 + G / 2 + (360 - G) * i / 32) * Math.PI / 180;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (100 + R * Math.cos(a)).toFixed(2));
    c.setAttribute("cy", (100 + R * Math.sin(a)).toFixed(2));
    c.setAttribute("r", "5.4");
    c.setAttribute("class", "bead");
    svg.appendChild(c);
    beads.push(c);
  }
  const imam = document.createElementNS(NS, "circle");
  imam.setAttribute("cx", "100"); imam.setAttribute("cy", String(100 - R));
  imam.setAttribute("r", "7.6"); imam.setAttribute("class", "bead imam");
  svg.appendChild(imam);
}

function paint(bump) {
  $("count").textContent = T.fmt(st.n);
  const cyc = Math.floor(st.n / 33);
  $("cycles").textContent = cyc ? "× " + T.fmt(cyc) + " مسبحة" : "";
  const k = st.n % 33, full = st.n > 0 && k === 0;
  beads.forEach((b, i) => {
    b.classList.toggle("on", full || i < k);
    b.classList.toggle("now", !full && i === k - 1);
  });
  $("beads").classList.toggle("full", full);
  if (bump) {
    const b = document.querySelector(".p-btn");
    b.classList.remove("p-pulse"); void b.offsetWidth; b.classList.add("p-pulse");
  }
}

function haptic(n) {
  if (!navigator.vibrate) return;
  if (n % 100 === 0) navigator.vibrate([70, 50, 70]);
  else if (n % 33 === 0) navigator.vibrate([45, 35, 45]);
  else navigator.vibrate(10);
}

function floatPlus(x, y) {
  const s = document.createElement("span");
  s.className = "plus"; s.textContent = "+١";
  s.style.left = x + "px"; s.style.top = y + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 750);
}

/* ─────────── الرفع والقراءة ─────────── */
async function sync(keep) {
  if (!dirty || syncing || !st) return;
  syncing = true;
  const n = st.n;
  try {
    await (keep ? T.patchKeep : T.patch)(code, "p/" + me,
      { n, name: st.name, sid: st.sid, t: T.NOW });
    if (st.n === n) dirty = false;
    setNet(true);
  } catch (e) { setNet(false); }
  finally { syncing = false; }
}

let known = new Set();
async function poll() {
  let room;
  try { room = await T.get(code, null); setNet(true); }
  catch (e) { setNet(false); return; }
  if (!room || !room.m) return;

  if (room.m.sid && room.m.sid !== (st.sid || "")) newRound(room.m.sid);
  meta = room.m;
  paintMeta();

  const list = board(room, Date.now());
  const total = list.reduce((a, x) => a + x.n, 0);
  $("total").textContent = T.fmt(total);

  const g = +meta.g || 0;
  $("goalFill").style.width = g ? Math.min(100, total / g * 100) + "%" : "0";
  $("goalText").textContent = !g ? ""
    : total >= g ? "🎉 بلغتم الهدف معاً"
    : "الهدف " + T.fmt(g) + " — بقي " + T.fmt(g - total);

  paintFamily(list);
}

function paintFamily(list) {
  const box = $("fam");
  box.innerHTML = "";
  list.forEach((x, i) => {
    if (!known.has(x.id) && started && known.size) toast("🤍 انضمّ " + x.name);
    known.add(x.id);
    const row = document.createElement("div");
    row.className = "fam-row" + (x.id === me ? " me" : "") + (x.active ? "" : " idle");
    const nm = document.createElement("span");
    nm.className = "fam-name";
    nm.textContent = x.name + (x.id === me ? " (أنت)" : "");
    const n = document.createElement("span");
    n.className = "fam-n";
    n.textContent = T.fmt(x.n);
    row.append(nm, n);
    if (owner && x.id !== me) {
      const del = document.createElement("button");
      del.className = "fam-x"; del.textContent = "✕";
      del.title = "أخرِجه من الحلقة";
      del.addEventListener("click", async () => {
        try { await T.put(code, "k/" + x.id, true); poll(); } catch (e) {}
      });
      row.appendChild(del);
    }
    box.appendChild(row);
  });
}

function newRound(sid) {
  st = { name: st.name, n: 0, sid };
  T.save("room_" + code, st);
  paint(false);
  dirty = true; sync();
  toast("بدأت جولة جديدة");
}

/* ─────────── المشاركة ─────────── */
function share(firstTime) {
  const url = T.joinUrl(code);
  const text = "📿 " + (meta ? meta.ti : "حلقة ذكر") + " — سبّح معنا:\n" + url;
  if (navigator.share) {
    navigator.share({ title: "حلقة ذكر", text, url }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(url)
      .then(() => toast("نُسخ الرابط — أرسله لأهلك"))
      .catch(() => toast(url));   /* نافذة prompt محجوبةٌ داخل تطبيق أندرويد */
  }
  if (firstTime) toast("أرسل الرابط لأهلك ليدخلوا");
}

/* ─────────── إعدادات صاحب الحلقة ─────────── */
const setPick = { d: "istighfar", g: 0 };
function openOwner() {
  setPick.d = meta.d || "istighfar";
  setPick.g = +meta.g || 0;
  chips($("setDhikr"), dhikrItems(), setPick.d, v => { setPick.d = v; });
  chips($("setGoal"), goalItems(), setPick.g, v => { setPick.g = v; });
  $("ownerSheet").classList.remove("hidden");
}

/* الشاشة لا تنطفئ وأنت تسبّح */
let lock = null;
async function wake() {
  if (lock || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try {
    lock = await navigator.wakeLock.request("screen");
    lock.addEventListener("release", () => { lock = null; });
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") sync(true);
  else if (started) { wake(); poll(); }
});
window.addEventListener("pagehide", () => sync(true));

/* ─────────── الأزرار ─────────── */
$("goNew").addEventListener("click", openNew);
$("newBack").addEventListener("click", () => show("sStart"));
$("newGo").addEventListener("click", create);
$("codeGo").addEventListener("click", () => {
  const c = T.cleanCode($("codeIn").value);
  if (!T.validCode(c)) { $("startErr").textContent = "الكود من ٣ إلى ١٢ حرفاً أو رقماً"; return; }
  $("startErr").textContent = "";
  enter(c);
});
$("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") $("codeGo").click(); });
$("nameGo").addEventListener("click", setName);
$("nameIn").addEventListener("keydown", e => { if (e.key === "Enter") setName(); });
$("rename").addEventListener("click", () => { $("nameIn").value = st.name; show("sName"); });
$("msgBack").addEventListener("click", () => {
  history.replaceState(null, "", location.pathname);
  show("sStart");
});
$("tap").addEventListener("pointerdown", tap);
document.addEventListener("keydown", e => {
  if (e.repeat || $("sMain").classList.contains("hidden")) return;
  if (e.key === " " || e.key === "Enter") tap(e);
});
$("shareBtn").addEventListener("click", () => share(false));
$("ownerBtn").addEventListener("click", openOwner);
$("setClose").addEventListener("click", () => $("ownerSheet").classList.add("hidden"));
$("setSave").addEventListener("click", async () => {
  try {
    await T.patch(code, "m", { d: setPick.d, g: setPick.g });
    $("ownerSheet").classList.add("hidden");
    poll();
    toast("✅ حُفظ");
  } catch (e) { toast("تعذّر الحفظ"); }
});
$("setReset").addEventListener("click", async () => {
  if (!confirm("تصفير عدّادات الجميع والبدء من جديد؟")) return;
  try {
    await T.patch(code, null, { "m/sid": T.rid(8), "m/c": T.NOW, p: null, k: null, s: null });
    $("ownerSheet").classList.add("hidden");
    toast("🔄 جولة جديدة");
  } catch (e) { toast("تعذّر — تحقّق من الإنترنت"); }
});


/* ─────────── سهم الرجوع ───────────
   يرجع خطوةً داخل الصفحة إن كان فيها خطوة، وإلا خرج إلى التطبيق.
   وكان الخروج متعذّراً: من دخل الحلقة لم يجد بابًا يخرج منه. */
function visible() { return SCREENS.filter(s => !$(s).classList.contains("hidden"))[0] || "sStart"; }
$("back").addEventListener("click", () => {
  const cur = visible();
  if (cur === "sNew" || cur === "sMsg") {
    history.replaceState(null, "", location.pathname);
    show("sStart");
  } else if (cur === "sName" && st) {
    show("sMain");
  } else {
    location.href = "../";
  }
});

/* عنوان الشريط يتبع الحلقة التي أنت فيها */
function barSub(t) { const e = $("barSub"); if (e) e.textContent = t; }

const q = new URLSearchParams(location.search).get("r") || location.hash.replace("#", "");
if (q) enter(q); else show("sStart");
})();
</script>
