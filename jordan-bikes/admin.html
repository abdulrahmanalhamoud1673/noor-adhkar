<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الحجوزات — Jordan Bikes</title>
<meta name="theme-color" content="#07080a">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="assets/styles.css">

</head>
<body class="admin">

  <defs>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M4.5 20h15"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 8l-4 4 4 4M5 12h10"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h3.2l1.6 4.2-2.1 1.4a11 11 0 0 0 5.2 5.2l1.4-2.1 4.2 1.6V17a3 3 0 0 1-3 3A15.5 15.5 0 0 1 2 6.5a3 3 0 0 1 3-3z"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2a9.9 9.9 0 0 0-8.47 15.02L2.5 21.5l4.6-1.05A9.92 9.92 0 1 0 12.04 2zm0 18.13a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-2.73.62.64-2.65-.2-.32a8.22 8.22 0 1 1 6.78 3.68zm4.5-6.15c-.25-.12-1.47-.72-1.7-.8-.23-.09-.39-.13-.56.12-.16.25-.64.8-.79.97-.14.16-.29.19-.54.06a6.7 6.7 0 0 1-3.32-2.9c-.25-.43.25-.4.72-1.34.08-.16.04-.3-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.47a.9.9 0 0 0-.66.31 2.77 2.77 0 0 0-.87 2.06 4.8 4.8 0 0 0 1.01 2.56 11 11 0 0 0 4.2 3.71c1.57.68 2.18.73 2.96.62.48-.07 1.47-.6 1.68-1.18.2-.58.2-1.08.14-1.18-.06-.11-.22-.17-.47-.3z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></symbol>

    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

    <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>

</svg>

<header class="adm-top">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="logo-mark" data-bike="mark"></span><span>Jordan Bikes</span></a>
    <span class="adm-title">لوحة الحجوزات</span>
    <span class="adm-mode" id="mode"></span>
    <div class="adm-actions" id="topActions" hidden>
      <button class="icon-btn" id="btnRefresh" title="تحديث" aria-label="تحديث"><svg><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="btnCsv" title="تنزيل Excel" aria-label="تنزيل Excel"><svg><use href="#i-download"/></svg></button>
      <button class="icon-btn" id="btnLogout" title="خروج" aria-label="خروج" hidden><svg><use href="#i-logout"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap adm-main">

  <section class="login" id="login" hidden>
    <div class="login-card">
      <div class="login-ic"><svg><use href="#i-lock"/></svg></div>
      <h1>دخول الإدارة</h1>
      <p>اكتب كلمة السر اللي حطّيتها في ملف Code.gs</p>
      <form id="loginForm">
        <input class="input" id="key" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
        <label class="check"><input type="checkbox" id="remember" checked> <span>تذكّرني على هذا الجهاز</span></label>
        <div class="ferr" id="loginErr"></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="loginBtn">دخول</button>
      </form>
    </div>
  </section>

  <section id="dash" hidden>
    <div class="demo-banner" id="demoBanner" hidden>
      <svg><use href="#i-info"/></svg>
      <div>
        <b>وضع التجربة</b> — الموقع لسّا مش مربوط بجدول Google، فاللوحة بتعرض الحجوزات اللي انعملت <u>من هذا الجهاز فقط</u>، وكل حجز بيوصلك على واتساب.
        لتشوف حجوزات كل الزبائن هون، اتبع خطوات «ربط الحجوزات» في ملف README.md.
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <div class="seg range" id="range">
        <button data-range="today">اليوم</button>
        <button data-range="tomorrow">بكرا</button>
        <button data-range="week">7 أيام</button>
        <button data-range="upcoming" class="on">القادمة</button>
        <button data-range="past">السابقة</button>
        <button data-range="all">الكل</button>
      </div>
      <div class="tb-right">
        <select class="input sel" id="statusFilter" aria-label="الحالة">
          <option value="">كل الحالات</option>
          <option value="active">النشطة (بدون الملغية)</option>
          <option value="pending">بانتظار التأكيد</option>
          <option value="confirmed">مؤكّد</option>
          <option value="attended">حضر</option>
          <option value="noshow">لم يحضر</option>
          <option value="cancelled">ملغي</option>
        </select>
        <label class="search"><svg><use href="#i-search"/></svg><input class="input" id="q" type="search" placeholder="اسم، رقم، أو رقم حجز"></label>
      </div>
    </div>

    <div id="groups"></div>
    <div class="adm-foot" id="lastSync"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js"></script>
<script src="assets/shared.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
