<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2e20">
<title>رسالة لصاحب السيارة — زمّور</title>
<meta name="description" content="ابعث رسالة لصاحب هاي السيارة بدون ما تعرف رقمه.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="narrow" id="app">
  <div class="scan-head">
    <div class="badge"><img src="/logo.svg" alt="">زمّور</div>
    <h1>ابعث رسالة لصاحب السيارة</h1>
    <div class="carname" id="carname">…</div>
  </div>
  <div id="state"></div>

  <form id="form" class="hide" autocomplete="off">
    <div class="sec-title">🚨 مستعجل</div>
    <div class="chips urgent" id="g-urgent"></div>
    <div class="sec-title">👋 تنبيه سريع</div>
    <div class="chips" id="g-forgot"></div>

    <div class="sec-title">✍️ أو اكتب رسالة قصيرة <span class="muted small" style="font-weight:500">(اختياري)</span></div>
    <textarea id="text" maxlength="140" placeholder="مثلاً: سيارتك واقفة قدام مدخل العمارة"></textarea>
    <div class="counter"><span id="cnt">0</span>/140</div>
    <input class="hp" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="ts"></div>

    <div class="privacy-note">🔒 <span>صاحب السيارة ما بيشوف رقمك ولا اسمك، وإنت ما بتشوف رقمه. ممنوع السب والمعاكسة ومشاركة الأرقام.</span></div>
    <div id="err"></div>
    <div class="sticky-send"><button class="btn btn-primary btn-lg btn-block" id="send" type="submit" disabled>أرسل الرسالة</button></div>
  </form>
  <p class="muted small" style="text-align:center;margin:26px 0"><a href="/">ما هو زمّور؟</a> · <a href="/privacy">الخصوصية</a></p>
</div>
<script src="/js/common.js"></script>
<script src="/js/scan.js"></script>
</body>
</html>
